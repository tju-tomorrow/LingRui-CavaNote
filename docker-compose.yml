# LingRui CavaNote 的本地依赖服务
#
#   docker compose up -d
#   cp apps/collab/.env.example apps/collab/.env
#   bun run dev:collab
#
# 说明（见 ADR-0007）：缓存用 Valkey（BSD-3，Redis 的 LF 分叉），
# 避免 Redis 改 license 后的疑义；对象存储用 MinIO（AGPL，与本项目一致）。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lingrui
      POSTGRES_PASSWORD: lingrui
      POSTGRES_DB: lingrui
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingrui"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  valkeydata:
  miniodata:
