# electron-builder 打包配置（见 PRD/桌面端.md §4）
appId: pro.lingrui.scribe
productName: LingRui Scribe
directories:
  output: release
  buildResources: build

# bun workspace：node_modules/@lingrui/* 是 symlink，electron-builder 默认会遍历/重建，
# 在 monorepo 里会卡在 packaging。这里全部关掉（依赖都是纯 JS，无需 rebuild）。
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

files:
  - out/**
  - package.json

# main/preload 是 bundle 产物；这些原生/重量级依赖保持外置，由 builder 收进 asar
asarUnpack:
  - node_modules/pg/**
  - node_modules/ioredis/**

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true

win:
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb
  category: Office

# 自动更新：静态托管（S3/MinIO）即可
publish:
  provider: generic
  url: https://updates.lingrui.local/desktop
